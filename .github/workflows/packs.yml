# Checks the packs (the examples and the community catalog) on every change to them: pack.json is valid and has the
# catalog's metadata, there's a cover.png, every drawing compiles against the app's shader, and the catalog's index is
# up to date. GitHub's macOS machines have no GPU, so the drawings are compiled with the offline Metal compiler.
name: packs

on:
  pull_request:
    paths: ["packs/**", "community/**", "Sources/Fishbots/**", "scripts/catalog.py", ".github/workflows/packs.yml"]
  push:
    branches: [main]
    paths: ["packs/**", "community/**", "Sources/Fishbots/**", "scripts/catalog.py"]

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Build
        run: swift build -c release
      - name: The app's own shader compiles
        run: .build/release/Fishbots --check-shaders --offline
      - name: Check every pack
        run: |
          status=0
          for dir in packs/examples/*/ community/packs/*/; do
            [ -f "$dir/pack.json" ] || continue
            echo "::group::$dir"
            .build/release/Fishbots --check "$dir" --catalog --offline || status=1
            echo "::endgroup::"
          done
          .build/release/Fishbots --check packs/template --offline || status=1
          exit $status
      - name: Catalog index is up to date
        run: python3 scripts/catalog.py --check
